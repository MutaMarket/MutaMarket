[package]
name = "mutamarket"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "MutaMarket: marketplace and toolbox for abyssal modules in EVE Online"
default-run = "mutamarket"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
dotenvy = "0.15"
flate2 = "1"
sha2 = "0.11"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rand = "0.10"
# The native random forest estimator (src/estimator/forest.rs): rayon
# parallelizes tree fitting, bincode packs trained models for storage.
rayon = "1"
bincode = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact f64 parsing, needed by the sklearn parity
# fixture's bit-identical threshold assertions (tests/estimator_forest.rs).
serde_json = { version = "1", features = ["float_roundtrip"] }
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "migrate",
] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
base64 = "0.23.1"
futures-util = "0.3"
# The OpenGraph card renderer (src/og) builds an SVG document and
# rasterizes it. `system-fonts`/`memmap-fonts` stay off so the only faces
# in the database are the ones we load from assets/fonts, which keeps the
# cards identical on every machine; `raster-images` decodes the embedded
# textures (PNG) and character portraits (JPEG, the image server's one
# exception).
resvg = { version = "0.48", default-features = false, features = [
    "text",
    "raster-images",
] }
# Glyph advances and the ascender, for the text measuring the legacy did
# with Imagick::queryFontMetrics (truncation, centering, value offsets).
ttf-parser = "0.25"
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-axum = "0.2.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-onig", "html"] }

[dev-dependencies]
http-body-util = "0.1"
# Encodes the JPEG portrait the OG character-card test serves.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
jsonwebtoken = "11"
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "mutamarket"
path = "src/main.rs"

[[bin]]
name = "sde_import"
path = "src/bin/sde_import.rs"

[[bin]]
name = "contracts_sync"
path = "src/bin/contracts_sync.rs"

[[bin]]
name = "estimate_values"
path = "src/bin/estimate_values.rs"

[[bin]]
name = "train_estimators"
path = "src/bin/train_estimators.rs"

# The Axum handlers return `Result<_, Response>`; the Response error is
# large by design (it carries a full HTTP response), so this stylistic
# lint fires across every handler. Allowed package-wide so a newer
# clippy's `-D warnings` in CI matches local.
[lints.clippy]
result_large_err = "allow"
