[package]
name = "mutamarket"
version = "0.1.0"
edition = "2024"
default-run = "mutamarket"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
dotenvy = "0.15"
flate2 = "1"
jsonwebtoken = "9"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rand = "0.9"
# The native random forest estimator (src/estimator/forest.rs): rayon
# parallelizes tree fitting, bincode packs trained models for storage.
rayon = "1"
bincode = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact f64 parsing, needed by the sklearn parity
# fixture's bit-identical threshold assertions (tests/estimator_forest.rs).
serde_json = { version = "1", features = ["float_roundtrip"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    # The one-time legacy production import reads the Laravel MySQL dump
    # directly (src/legacy, `cargo run --bin legacy_import`).
    "mysql",
    "migrate",
] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
base64 = "0.22.1"
futures-util = "0.3"

[dev-dependencies]
http-body-util = "0.1"
jsonwebtoken = "9"
tokio-tungstenite = "0.26"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "mutamarket"
path = "src/main.rs"

[[bin]]
name = "sde_import"
path = "src/bin/sde_import.rs"

[[bin]]
name = "contracts_sync"
path = "src/bin/contracts_sync.rs"

[[bin]]
name = "estimate_values"
path = "src/bin/estimate_values.rs"

[[bin]]
name = "legacy_import"
path = "src/bin/legacy_import.rs"
