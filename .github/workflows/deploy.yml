# Builds the api and frontend images natively for the box's arm64 CPU,
# publishes them to GHCR tagged with the commit sha (and `latest`), then
# moves the production checkout to that commit and runs
# deploy/deploy.sh there over ssh. Runs after CI passes on main; run it
# by hand with an older sha to roll back.
#
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key whose
# public half is in the box's authorized_keys) and DEPLOY_KNOWN_HOSTS
# (the box's `ssh-keyscan` line, so the host key is pinned).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy (default the current head of main)
        required: false

# One deploy at a time, and a running one finishes before the next starts.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/mutamarket

jobs:
  resolve:
    name: Resolve commit
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - id: pick
        run: echo "sha=${{ github.event.inputs.sha || github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}
    needs: resolve
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: .
          - image: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ needs.resolve.outputs.sha }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    name: Deploy to production
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://mutamarket.com
    steps:
      - name: Configure ssh
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Roll the stack
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -eu; cd /opt/mutamarket; git fetch --quiet origin; git reset --quiet --hard ${{ needs.resolve.outputs.sha }}; exec deploy/deploy.sh ${{ needs.resolve.outputs.sha }}"
