# Visit https://soloterm.com to learn more
name: mutamarket
icon: null
processes:
  Run:
    command: cargo run
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed:
      - src/**/*.rs
      - Cargo.toml
      - migrations/**/*.sql
      - .env
    env: {}
  Postgres:
    command: docker compose up postgres
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
  Tailwind:
    command: npx @tailwindcss/cli -i styles/app.css -o target/site/app.css --watch
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
