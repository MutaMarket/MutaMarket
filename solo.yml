# Visit https://soloterm.com to learn more
name: mutamarket
icon: null
processes:
  Api:
    command: cargo run
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed:
      - src
      - Cargo.toml
      - content
      - migrations
    env: {}
  Frontend:
    command: npm run dev
    working_dir: frontend
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  Postgres:
    command: docker compose up postgres
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
