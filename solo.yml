# Visit https://soloterm.com to learn more
name: mutamarket
icon: null
processes:
  Api:
    command: cargo run
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed:
      - src
      - Cargo.toml
      - content
      - migrations
    env: {}
  Frontend:
    command: npm run dev
    working_dir: frontend
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  Postgres:
    command: docker compose up postgres
    working_dir: null
    auto_start: true
    auto_restart: false
    restart_when_changed: []
    env: {}
  # The full composed stack on http://localhost:5100 (Postgres, SDE
  # bootstrap, API, frontend, proxy). Start on demand; stop Api/Frontend
  # first so nothing double-serves.
  Stack:
    command: docker compose up --build
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  # The stack with the hot-reloading frontend on the shared origin:
  # edits under frontend/ refresh http://localhost:5100 instantly (the
  # vite server is also reachable directly on :5180).
  DevStack:
    command: docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile dev up --build
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
