services:
  postgres:
    image: postgres:17
    container_name: mutamarket-postgres
    environment:
      POSTGRES_USER: mutamarket
      POSTGRES_PASSWORD: mutamarket
      POSTGRES_DB: mutamarket
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
