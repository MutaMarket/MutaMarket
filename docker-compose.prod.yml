# Production overrides: `docker compose -f docker-compose.yml
# -f docker-compose.prod.yml up -d --build`. Caddy takes the public
# ports and TLS for the domain in deploy/Caddyfile; the api runs in
# production mode; Postgres needs POSTGRES_PASSWORD set in .env, and
# STACK_ORIGIN the public origin (https://mutamarket.com) with STACK_HOST
# its host (mutamarket.com) for Caddy.

services:
  postgres:
    ports: !reset []
    # Sized for an 8 GB box shared with the API (about 2.5 GB resident,
    # 3.5 GB while training): a quarter of RAM for shared buffers, the
    # rest of the page cache as the planner's estimate, SSD cost model,
    # and a slow-statement log for the console's query watch.
    command:
      - postgres
      - -c
      - shared_buffers=1536MB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=24MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_connections=60
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=2GB
      - -c
      - jit=off
      - -c
      - log_min_duration_statement=250ms

  api:
    environment:
      APP_ENV: production
      EVE_CALLBACK_URL: ${STACK_ORIGIN}/eve/callback

  frontend:
    environment:
      ORIGIN: ${STACK_ORIGIN}

  proxy:
    environment:
      STACK_HOST: ${STACK_HOST}
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
